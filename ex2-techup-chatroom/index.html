<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- Start coding here -->
  <header class="chat-header">
    <h1>Techup Chatroom</h1>
  </header>

  <main class="chat-area">
    <div class="messages-sent">
      <div class="bubble bubble-green bubble-tail">สวัสดีจ้า</div>
      <div class="bubble bubble-light-gray">
        <button type="button" class="close-btn" aria-label="Close">×</button>
        Coding สนุกจังเลย
      </div>
      <div class="bubble bubble-green">😂 ❤️</div>
    </div>

    <div class="messages-received">
      <div class="bubble bubble-gray">😘</div>
      <div class="bubble bubble-gray">😚</div>
    </div>
  </main>
</body>

</html>
